    turbulence: 5
  - type: sphere
    radius: 15
    position: [16, 16, 130]
    color: [.999, .999, .0]
    material: Refraction
  - type: sphere
    radius: 10
    position: [80, 12, 92]
    color: [0, .999, 0]
  - type: sphere
    radius: 5
    position: [50, 75, 81.6]
    color: [0, .682, .999]
  # Walls: box x in [1, 99], y in [0, 81.6], z in [0, 300],
  # each face oversized 5 units so corner seams cannot leak
  # Left (x = 1)
  - type: quad
    position: [1, -5, -5]
    u: [0, 91.6, 0]
    v: [0, 0, 310]
    color: [0.75, 0.25, 0.25]
  # Right (x = 99)
  - type: quad
    position: [99, -5, -5]
    u: [0, 91.6, 0]
    v: [0, 0, 310]
    color: [0.25, .75, 0.75]
  # Back (z = 0)
  - type: quad
    position: [-4, -5, 0]
    u: [108, 0, 0]
    v: [0, 91.6, 0]
    color: [0.75, 0.75, 0.75]
  # ArmoniK logo on the back wall (2468x654 image), 0.05 in front of it:
  # coplanar it would tie-break per-ulp and speckle. Transparent around and
  # inside the letters, where the wall shows through.
  - type: quad
    position: [22, 63, 0.05]
    u: [56, 0, 0]
    v: [0, 14.84, 0]
    texture: image
    file: armonik.png
  # Front (z = 300, behind the camera)
  - type: quad
    position: [-4, -5, 300]
    u: [108, 0, 0]
    v: [0, 91.6, 0]
  # Floor (y = 0)
  - type: quad
    position: [-4, 0, -5]
    u: [108, 0, 0]
    v: [0, 0, 310]
    color: [0.75, 0.75, 0.75]
  # Ceiling (y = 81.6)
  - type: quad
    position: [-4, 81.6, -5]
    u: [108, 0, 0]
    v: [0, 0, 310]
    color: [0.75, 0.75, 0.75]
