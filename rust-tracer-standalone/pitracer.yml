recursion_depth: 30
samples: 100
gamma: 3
camera:
  origin: [50, 52, 295.6]
  direction: [0, -0.042612, -1]
  field_of_view: 35
objects:
  # Top Light (elliptical panel just below the ceiling at y = 81.6:
  # coplanar with the ceiling quad it would tie-break per-ulp and speckle)
  - type: ellipse
    position: [50, 81.5, 61.6]
    u: [12, 0, 0]
    v: [0, 0, 8]
    emission: [10, 10, 10]
  # Balls
  - type: sphere
    radius: 16.5
    position: [40, 16.5, 47]
    color: [.999, .999, .999]
    material: Metal
    fuzziness: 0.1
  - type: sphere
    radius: 16.5
    position: [73, 42.5, 88]
    color: [.999, .999, .999]
    material: Refraction
  - type: sphere
    radius: 10
    position: [15, 45, 112]
    texture: marble
    color: [.9, .9, .9]
