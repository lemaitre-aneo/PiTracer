recursion_depth: 30
samples: 1000
camera:
  origin: [0, 0, -10]
  direction: [0, 0, 1]
objects:
  # Top Light
  - type: ellipse
    position: [0, 9.9, 3]
    u: [4, 0, 0]
    v: [0, 0, 2.5]
    emission: [1, 1, 1]
  # Walls: box x, y, z in [-10, 10] (see scene.yml)
  - type: quad
    position: [-10, -13, -13]
    u: [0, 26, 0]
    v: [0, 0, 26]
    color: [0.75, 0, 0]
  - type: quad
    position: [10, -13, -13]
    u: [0, 26, 0]
    v: [0, 0, 26]
    color: [0.25, .075, 0.75]
  - type: quad
    position: [-13, -13, 10]
    u: [26, 0, 0]
    v: [0, 26, 0]
    color: [0.75, 0.75, 0.75]
  - type: quad
    position: [-13, -13, -10]
    u: [26, 0, 0]
    v: [0, 26, 0]
  - type: quad
    position: [-13, 10, -13]
    u: [26, 0, 0]
    v: [0, 0, 26]
    color: [0.75, 0.75, 0.75]
  - type: quad
    position: [-13, -10, -13]
    u: [26, 0, 0]
    v: [0, 0, 26]
    color: [0.75, 0.75, 0.75]

  # Meshes. Keys: `model` (an OBJ or STL file, relative to this file) or
  # inline `vertices` + `triangles` (with optional per-vertex `normals` and
  # `uvs`); `smooth` interpolates normals; placed by `scaling` (a factor or
  # [x, y, z]), then `rotation` (degrees about x, then y, then z), then
  # `position`. (`scale` is the marble texture's key, not the mesh's.)

  # Trefoil knot (OBJ: quads, texture coordinates, vertex normals), smooth
  # golden metal
  - type: mesh
    model: models/knot.obj
    smooth: true
    scaling: 1.6
    rotation: [-20, 0, 0]
    position: [-3, 2, 4]
    material: Metal
    fuzziness: 0.05
    color: [0.9, 0.7, 0.3]
  # Icosahedron (binary STL), flat-faced glass (glass needs a near-white
  # color: the default color is black, which absorbs everything)
  - type: mesh
    model: models/gem.stl
    scaling: 1.6
    rotation: [0, 30, 15]
    position: [5, -6.8, 1]
    material: Refraction
    color: [0.97, 0.99, 0.999]
  # Square pyramid given inline, in marble
  - type: mesh
    vertices: [[-1, 0, -1], [1, 0, -1], [1, 0, 1], [-1, 0, 1], [0, 1.4, 0]]
    triangles: [[0, 2, 1], [0, 3, 2], [0, 1, 4], [1, 2, 4], [2, 3, 4], [3, 0, 4]]
    scaling: 2.5
    rotation: [0, 25, 0]
    position: [-4, -10, 5]
    texture: marble
    color: [0.85, 0.85, 0.8]
    vein_color: [0.2, 0.25, 0.3]
    scale: 2.5
