[workspace]
resolver = "3"
members = [ "rust-tracer-client","rust-tracer-lib", "rust-tracer-standalone", "rust-tracer-worker"]

# Dependencies shared by several members. Features listed here are those every
# member needs; members add their own.
[workspace.dependencies]
raytracer = { path = "rust-tracer-lib", package = "rust-tracer-lib" }
# Pinned to the Open Image Denoise version it links against (shell.nix,
# rust-tracer-worker/Dockerfile): the crate's versions track the library's.
# From git: the crates.io packages (2.4.1 to 2.5.1) lack the oidn_hashes/
# directory that the `bundled` feature needs.
oidn = { git = "https://github.com/Twinklebear/oidn-rs", tag = "2.5.1" }
armonik = { version = "3.29.3-beta-0", features = ["serde"] }
async-stream = "0.3"
clap = { version = "4.6", features = ["derive"] }
config = "0.15"
eyre = "0.6"
futures = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# mimalloc v3 is the default from 0.1.52 on (the `v3` feature is gone).
mimalloc = "0.1.52"
rand = "0.10"
rayon = "1.12"
sdl2 = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
tokio = { version = "1.0", features = ["full"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release-with-debug]
inherits = "release"
debug = true

# The statistical tests in rust-tracer-lib need optimized Monte-Carlo loops.
[profile.test]
opt-level = 3
