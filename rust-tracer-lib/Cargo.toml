[package]
name = "rust-tracer-lib"
version = "0.1.0"
edition = "2024"

[features]
compute = []
# Open Image Denoise (`Denoiser`): a native library, found through OIDN_DIR
# (shell.nix, Dockerfile), or downloaded when a dependent turns on oidn's
# `bundled` feature (rust-tracer-standalone).
denoise = ["dep:oidn"]
# Text in SVG images: laid out with the system's fonts and the fonts a
# texture lists, then turned into paths when the image is loaded, so that
# what travels to the workers is text-free (they do not need this feature).
svg-text = ["usvg/text", "usvg/system-fonts"]

[dependencies]
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
fastnoise-lite = "1"
oidn = { workspace = true, optional = true }
image = { workspace = true, features = ["gif", "webp"] }
base64 = "0.23.1"
# `writer`: SVGs are made self-contained when loaded (text as paths, image
# files embedded) by writing them back.
usvg = { version = "0.48.1", default-features = false, features = ["writer"] }

[dev-dependencies]
tempfile.workspace = true
