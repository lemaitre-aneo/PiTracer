[package]
name = "rust-tracer-lib"
version = "0.1.0"
edition = "2024"

[features]
compute = []
# Open Image Denoise (`Denoiser`): a native library, found through OIDN_DIR
# (shell.nix, Dockerfile).
denoise = ["dep:oidn"]

[dependencies]
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fastnoise-lite = "1"
# Pinned to the Open Image Denoise version it links against (shell.nix,
# rust-tracer-worker/Dockerfile): the crate's versions track the library's.
oidn = { version = "=2.4.1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3.27.0"
