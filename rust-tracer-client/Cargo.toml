[package]
name = "rust-tracer-client"
version = "0.1.0"
edition = "2024"

[dependencies]
raytracer = { path = "../rust-tracer-lib", package = "rust-tracer-lib" }
armonik = { version = "3.28.0-beta-0", features = ["client", "serde"] }
async-stream = "0.3"
futures = "0.3"
config = "0.15"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
serde_json = "1.0"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mimalloc = { version = "0.1", features = ["v3"] }
